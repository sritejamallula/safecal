<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Shield/Badge -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#1E3A8A" />
  
  <!-- Subtle QR grid background accents -->
  <rect x="18" y="18" width="16" height="16" rx="3" fill="#3B82F6" opacity="0.3" />
  <rect x="66" y="18" width="16" height="16" rx="3" fill="#3B82F6" opacity="0.3" />
  <rect x="18" y="66" width="16" height="16" rx="3" fill="#3B82F6" opacity="0.3" />
  
  <!-- Weighing Scale Beam -->
  <path d="M 30 42 L 70 42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <path d="M 50 30 L 50 42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="30" r="4" fill="#60A5FA" />

  <!-- Left Scale Pan -->
  <path d="M 30 42 L 22 55 H 38 Z" fill="#60A5FA" opacity="0.9" />
  <!-- Right Scale Pan -->
  <path d="M 70 42 L 62 55 H 78 Z" fill="#60A5FA" opacity="0.9" />

  <!-- Ruler Marks at bottom -->
  <line x1="30" y1="76" x2="30" y2="82" stroke="#93C5FD" stroke-width="2" />
  <line x1="40" y1="76" x2="40" y2="80" stroke="#93C5FD" stroke-width="2" />
  <line x1="50" y1="76" x2="50" y2="84" stroke="#93C5FD" stroke-width="2" />
  <line x1="60" y1="76" x2="60" y2="80" stroke="#93C5FD" stroke-width="2" />
  <line x1="70" y1="76" x2="70" y2="82" stroke="#93C5FD" stroke-width="2" />

  <!-- Center Verified Check Badge -->
  <circle cx="50" cy="58" r="16" fill="#10B981" />
  <path d="M 43 58 L 48 63 L 57 53" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
